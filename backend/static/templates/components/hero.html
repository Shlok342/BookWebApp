<!-- templates/components/hero.html -->

<section class="hero">
    
    <div class="hero-inner">
  
      <div class="sanctuary-label-wrap">
  
        <div class="sanctuary-icon-circle">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
            <path
              d="M12 22C12 22 4 16 4 9a8 8 0 0 1 16 0c0 7-8 13-8 13z"
              fill="#3d6234"
            />
          </svg>
        </div>
  
        <p class="sanctuary-label">
          YOUR SANCTUARY
        </p>
  
      </div>
  
      <h1 class="hero-title">
        Curated Library
      </h1>
  
      <div class="hero-meta">
        <span id="storiesCount">
          <em>0 stories collected</em>
        </span>
  
        <span class="dot">·</span>
  
        <span>
          🌸 <span id="bloomedCount">0</span> fully bloomed
        </span>
      </div>
  
      <div class="mini-stats">
  
        <div class="mini-stat">
          📚 Books <strong id="miniBooks">0</strong>
        </div>
  
        <div class="mini-stat">
          📄 Pages <strong id="miniPages">0</strong>
        </div>
  
        <div class="mini-stat">
          🌿 This Month <strong id="miniMonth">0</strong>
        </div>
  
      </div>
  
      <div class="hero-actions">
        <button class="add-btn">📖 Add Book</button>
  
        <button class="insights-btn" id="openStats">
          📊 View Insights
        </button>
      </div>
  
    </div>
  </section>
