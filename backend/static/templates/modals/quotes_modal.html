<div id="quotesModal" class="modal">
    <div class="modal-content quotes-modal-content">
      <span class="close" id="quotesClose">&times;</span>
      <div class="modal-badge">✦</div>
      <h2 id="quotesModalTitle">Cherished Quotes</h2>
      <p class="quotes-counter"><span id="quotesCount">0</span> / 5</p>
      <div id="quotesList"></div>
      <div id="addQuoteArea">
        <textarea id="quoteInput" placeholder="What words spoke to you?" rows="3"></textarea>
        <button id="addQuoteBtn">+ Add Quote</button>
      </div>
    </div>
  </div>
