<div id="addBookModal" class="modal" style="overflow-y:auto;">
    <div class="modal-content" style="margin:20px auto; width:340px;">
      <span class="close" id="addBookClose">&times;</span>
      <div class="modal-badge">📖</div>
      <h2>New Story</h2>
      <p class="modal-sub">Add a book to your sanctuary</p>
      <input id="titleInput" placeholder="Book title">
      <input id="authorInput" placeholder="Author name">
      <input id="coverInput" placeholder="Image url to modify modal style.">
      <input id="totalPagesInput" placeholder="Total pages" type="number">
      <input id="currentPageInput" placeholder="Pages read so far (optional)" type="number">
      <select id="genreInput">
        <option value="">Select Genre</option>
        <option value="Fiction">Fiction</option>
        <option value="Fantasy">Fantasy</option>
        <option value="Sci-Fi">Sci-Fi</option>
        <option value="Mystery">Mystery</option>
        <option value="Thriller">Thriller</option>
        <option value="Romance">Romance</option>
        <option value="Non-Fiction">Non-Fiction</option>
        <option value="Biography">Biography</option>
        <option value="Self-Help">Self-Help</option>
        <option value="Philosophy">Philosophy</option>
        <option value="Adventure">Adventure</option>
        <option value="Classics">Classics</option>
      </select>
      <button id="saveBook">Save to Library</button>
    </div>
  </div>
