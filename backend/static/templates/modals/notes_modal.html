<div id="notesModal" class="modal">
    <div class="modal-content notes-modal-content">
      <span class="close" id="notesClose">&times;</span>
      <div class="modal-badge">📝</div>
      <h2 id="notesModalTitle">Notes</h2>
      <p class="notes-counter"><span id="notesWordCount">0</span> / 500 words</p>
      <textarea id="notesInput" placeholder="Write your thoughts about this book..." rows="10"></textarea>
      <button id="saveNotesBtn">Save Notes</button>
    </div>
  </div>
